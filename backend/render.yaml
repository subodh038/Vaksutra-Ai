services:
  - type: web
    name: vocalyze-ai-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    region: oregon # or your preferred region
    plan: free # or starter/standard depending on performance needs
    envVars:
      - key: CORS_ORIGINS
        value: "https://your-frontend-project.vercel.app" # UPDATE THIS to your Vercel URL
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
